<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Café & Aroma</title>


    <!-- Bootstrap -->

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


    <!-- CSS do projeto -->

    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <nav class="navbar navbar-expand-lg">

        <div class="container">


            <!-- NOME DA CAFETERIA -->

            <a class="navbar-brand"
               th:href="@{/}">

                Café & Aroma

            </a>


            <!-- BOTÃO MENU MOBILE -->

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- MENU -->

            <div class="collapse navbar-collapse"
                 id="menu">

                <ul class="navbar-nav ms-auto">


                    <!-- INÍCIO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/}">

                            Início

                        </a>

                    </li>


                    <!-- CARDÁPIO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/cardapio}">

                            Cardápio

                        </a>

                    </li>


                    <!-- PEDIDOS -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/pedidos}">

                            Pedidos

                            <span id="contadorCarrinho"
                                  class="badge bg-danger">

                                0

                            </span>

                        </a>

                    </li>


                    <!-- LOGIN -->

                    <li class="nav-item">

                        <a class="nav-link active"
                           th:href="@{/login}">

                            Login

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>

</header>



<!-- ================= LOGIN ================= -->

<main>

    <section class="login">

        <div class="container">


            <!-- TÍTULO -->

            <h2>
                Entrar na sua conta
            </h2>


            <p>
                Acesse sua conta do Café & Aroma
            </p>



            <!-- FORMULÁRIO -->

            <form th:action="@{/login}"
                  method="post">


                <!-- E-MAIL -->

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Digite seu e-mail"
                            required>

                </div>



                <!-- SENHA -->

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                            type="password"
                            id="senha"
                            name="senha"
                            placeholder="Digite sua senha"
                            required>

                </div>



                <!-- BOTÃO ENTRAR -->

                <button type="submit"
                        class="botao">

                    Entrar

                </button>


            </form>



            <!-- CADASTRO -->

            <p class="cadastro">

                Ainda não possui uma conta?

                <a th:href="@{/cadastro}">

                    Criar conta

                </a>

            </p>


        </div>

    </section>

</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>
        © 2026 Café & Aroma - Todos os direitos reservados.
    </p>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<!-- JavaScript do carrinho -->

<script th:src="@{/js/carrinho.js}">
</script>


</body>

</html>
