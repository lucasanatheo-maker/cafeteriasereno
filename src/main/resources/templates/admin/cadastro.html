
<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro - Café & Aroma</title>


   
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">


 

    <link rel="stylesheet"
          href="../../static/css/style.css">

</head>


<body>




<header>

    <nav class="navbar navbar-expand-lg">

        <div class="container">


           

            <a class="navbar-brand"
               href="../index.html">

                Café & Aroma

            </a>


            

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu"
                    aria-controls="menu"
                    aria-expanded="false"
                    aria-label="Abrir menu">

                <span class="navbar-toggler-icon"></span>

            </button>


          

            <div class="collapse navbar-collapse"
                 id="menu">

                <ul class="navbar-nav ms-auto">


                    <li class="nav-item">

                        <a class="nav-link"
                           href="../index.html">

                            Início

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="../pedidos/cardapio.html">

                            Cardápio

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="../pedidos/pedidos.html">

                            Pedidos

                            <span id="contadorCarrinho"
                                  class="badge bg-danger">

                                0

                            </span>

                        </a>

                    </li>


                    <li class="nav-item">

                        <a class="nav-link"
                           href="login.html">

                            Login

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>

</header>





<main>

    <section class="login">

        <div class="container">


            <h2>
                Criar sua conta
            </h2>


            <p>
                Cadastre-se no Café & Aroma
            </p>


            <form action="#"
                  method="post">


                <!-- NOME -->

                <div class="campo">

                    <label for="nome">
                        Nome completo
                    </label>

                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome completo"
                        required>

                </div>


               

                <div class="campo">

                    <label for="email">
                        E-mail
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required>

                </div>


               

                <div class="campo">

                    <label for="telefone">
                        Telefone
                    </label>

                    <input
                        type="tel"
                        id="telefone"
                        name="telefone"
                        placeholder="Digite seu telefone"
                        required>

                </div>


              

                <div class="campo">

                    <label for="senha">
                        Senha
                    </label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                        required>

                </div>


               

                <div class="campo">

                    <label for="confirmarSenha">
                        Confirmar senha
                    </label>

                    <input
                        type="password"
                        id="confirmarSenha"
                        name="confirmarSenha"
                        placeholder="Digite a senha novamente"
                        required>

                </div>


                

                <button type="submit"
                        class="botao">

                    Criar conta

                </button>


            </form>


          

            <p class="cadastro">

                Já possui uma conta?

                <a href="login.html">

                    Entrar

                </a>

            </p>


        </div>

    </section>

</main>





<footer>

    <p>
        © 2026 Café & Aroma - Todos os direitos reservados.
    </p>

</footer>





<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>



<script src="/static/js/carrinho.js"></script>


</body>

</html>
