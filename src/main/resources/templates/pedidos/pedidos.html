<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meus Pedidos - Café Sereno</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- CSS do projeto -->
    <link rel="stylesheet"
          th:href="@{/css/style.css}">

</head>


<body>


<!-- ================= HEADER ================= -->

<header>

    <nav class="navbar navbar-expand-lg">

        <div class="container">

            <!-- LOGO / NOME -->

            <a class="navbar-brand"
               th:href="@{/}">

                Café Sereno

            </a>


            <!-- BOTÃO MENU MOBILE -->

            <button class="navbar-toggler"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#menu">

                <span class="navbar-toggler-icon"></span>

            </button>


            <!-- MENU -->

            <div class="collapse navbar-collapse"
                 id="menu">

                <ul class="navbar-nav ms-auto">


                    <!-- INÍCIO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/}">

                            Início

                        </a>

                    </li>


                    <!-- CARDÁPIO -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/cardapio}">

                            Cardápio

                        </a>

                    </li>


                    <!-- PEDIDOS -->

                    <li class="nav-item">

                        <a class="nav-link active"
                           th:href="@{/pedidos}">

                            Pedidos

                            <span id="contadorCarrinho"
                                  class="badge bg-danger">

                                0

                            </span>

                        </a>

                    </li>


                    <!-- LOGIN -->

                    <li class="nav-item">

                        <a class="nav-link"
                           th:href="@{/login}">

                            Login

                        </a>

                    </li>


                </ul>

            </div>

        </div>

    </nav>

</header>



<!-- ================= CONTEÚDO ================= -->

<main>

    <section class="container py-5">


        <!-- TÍTULO -->

        <div class="text-center mb-5">

            <h1>
                Meu Pedido
            </h1>

            <p>
                Confira os produtos escolhidos.
            </p>

        </div>



        <!-- ================= LISTA DOS PEDIDOS ================= -->

        <div id="listaPedidos">

            <!-- Os produtos serão carregados pelo carrinho.js -->

        </div>



        <!-- ================= TOTAL ================= -->

        <div class="card mt-4 shadow-sm">

            <div class="card-body">


                <div class="d-flex justify-content-between">

                    <h4>
                        Total:
                    </h4>


                    <h4 id="totalPedido">

                        R$ 0,00

                    </h4>

                </div>



                <!-- LIMPAR CARRINHO -->

                <button class="btn btn-danger mt-3"
                        onclick="limparCarrinho()">

                    Limpar Carrinho

                </button>



                <!-- FINALIZAR PEDIDO -->

                <button class="btn btn-success mt-3"
                        onclick="finalizarPedido()">

                    Finalizar Pedido

                </button>


            </div>

        </div>



        <!-- ================= VOLTAR AO CARDÁPIO ================= -->

        <div class="text-center mt-4">

            <a th:href="@{/cardapio}"
               class="btn btn-dark">

                Voltar ao Cardápio

            </a>

        </div>


    </section>

</main>



<!-- ================= FOOTER ================= -->

<footer>

    <p>

        © 2026 Café Sereno - Todos os direitos reservados.

    </p>

</footer>



<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
</script>



<!-- JavaScript do carrinho -->

<script th:src="@{/js/carrinho.js}">
</script>


</body>

</html>
